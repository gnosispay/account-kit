name: Version release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # Required for npm OIDC
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "22"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        # Node 22 bundles npm 10; OIDC trusted publishing requires npm >=11.5.1.
        run: npm install --global npm@11

      - name: Get package info
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v3
        if: "contains(github.ref, steps.package.outputs.version)" # only works if tag contains correct package.version
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn --frozen-lockfile
      - run: npm publish --access public

      - name: Create Release
        if: "contains(github.ref, steps.package.outputs.version)" # only works if tag contains correct package.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ github.event.head_commit.message }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Release $GITHUB_REF" \
            --notes "$RELEASE_BODY"
